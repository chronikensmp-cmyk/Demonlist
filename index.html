<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>German Demonlist</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#121318;color:#e0e0e0;min-height:100vh}
button,input,select,textarea{font:inherit}
.app-container{display:flex;min-height:100vh}
.sidebar{width:320px;background:#1a1b23;border-right:1px solid #2a2c3a;display:flex;flex-direction:column;padding:15px;position:sticky;top:0;height:100vh}
.logo{font-size:22px;font-weight:bold;color:#fff;margin-bottom:10px;cursor:pointer}
.logo-highlight,.highlight-name{color:#ff6b00}
.tabs{display:flex;gap:10px;margin-bottom:10px}
.tab{background:none;border:none;color:#888;border-bottom:2px solid transparent;padding:5px 10px;font-weight:bold;cursor:pointer}
.tab.active{color:#ff6b00;border-bottom-color:#ff6b00}
#search{width:100%;padding:9px 12px;background:#121318;border:1px solid #2a2c3a;border-radius:6px;color:white;margin-bottom:10px}
.level-list{list-style:none;overflow-y:auto;flex-grow:1}
.level-item{padding:10px;border-radius:6px;margin-bottom:5px;cursor:pointer;background:#21232e;display:flex;gap:10px}
.level-item:hover{background:#2a2c3a}.level-item.active{background:#ff6b00;color:white}.rank{font-weight:bold}
.main-wrapper{flex-grow:1;display:flex;flex-direction:column;min-width:0}
.top-header{background:#1a1b23;border-bottom:1px solid #2a2c3a;padding:10px 20px;display:flex;justify-content:flex-end;align-items:center;gap:8px;position:sticky;top:0;z-index:20}
.account-btn,.header-action{display:flex;align-items:center;gap:10px;background:#21232e;border:1px solid #2a2c3a;padding:6px 12px;border-radius:20px;cursor:pointer;color:#fff;font-weight:bold;font-size:14px}
.header-action{border-radius:6px}.account-btn:hover,.header-action:hover{background:#2a2c3a}
.avatar-img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#2a2c3a}
.content{flex-grow:1;padding:20px;overflow-y:auto}
.level-title{font-size:28px;margin-bottom:8px}.description{color:#aaa;margin-bottom:15px;font-size:14px}
.video-container{position:relative;width:100%;max-width:700px;aspect-ratio:16/9;margin-bottom:15px;border-radius:8px;overflow:hidden;background:#000}
.video-container iframe{width:100%;height:100%;border:none}
.info-card,.panel{background:#1a1b23;padding:15px;border-radius:8px;max-width:700px;border:1px solid #2a2c3a}
.info-row{margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #2a2c3a;padding-bottom:6px;font-size:14px}
.info-row:last-child{margin-bottom:0}.info-label{color:#888;font-weight:bold}.info-value{color:#fff;text-align:right}
.difficulty-icon{height:24px;width:auto;vertical-align:middle;margin-right:6px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;justify-content:center;align-items:center;padding:20px}
.modal.active{display:flex}.modal-content{background:#1a1b23;border:1px solid #2a2c3a;border-radius:8px;padding:25px;width:95%;max-width:650px;max-height:90vh;overflow-y:auto;box-shadow:0 4px 20px #000}
.modal-title{font-size:20px;margin-bottom:15px;color:#fff}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-group{margin-bottom:12px}.form-group.full{grid-column:1/-1}
.form-group label{display:block;font-size:12px;color:#aaa;margin-bottom:4px}.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;background:#121318;border:1px solid #2a2c3a;border-radius:6px;color:#fff}.form-group textarea{min-height:80px;resize:vertical}
.btn-primary,.btn-secondary,.btn-danger,.btn-success{padding:10px;border-radius:6px;color:white;font-weight:bold;cursor:pointer;border:1px solid #2a2c3a}
.btn-primary{background:#ff6b00;border-color:#ff6b00}.btn-secondary{background:transparent;color:#aaa}.btn-danger{background:#8f2222}.btn-success{background:#26733b}
.button-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.button-row button{flex:1}
.error-message{color:#ff4d4d;font-size:12px;margin-bottom:10px;display:none}.success-message{color:#5bd477;font-size:12px;margin-bottom:10px}
.profile-avatar-large{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:0 auto 15px;display:block;border:2px solid #ff6b00;background:#2a2c3a}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.admin-card{background:#21232e;border:1px solid #2a2c3a;border-radius:8px;padding:14px}
.admin-card h3{margin-bottom:8px}.small{font-size:12px;color:#999}.badge{display:inline-block;padding:3px 7px;border-radius:10px;background:#2a2c3a;color:#bbb;font-size:11px;margin-left:5px}
@media(max-width:800px){.app-container{flex-direction:column}.sidebar{width:100%;height:auto;position:relative;max-height:45vh;border-right:0;border-bottom:1px solid #2a2c3a}.form-grid{grid-template-columns:1fr}.top-header{position:relative}}
</style>
</head>
<body>
<div class="app-container">
<aside class="sidebar">
<div class="logo" onclick="switchTab('classic')"><span class="logo-highlight">German</span> Demonlist</div>
<div class="tabs">
<button class="tab active" id="tab-classic" onclick="switchTab('classic')">CLASSIC</button>
<button class="tab" id="tab-players" onclick="switchTab('players')">PLAYERS</button>
</div>
<input type="text" id="search" placeholder="Search..." oninput="filterLevels()">
<ul id="level-list" class="level-list"></ul>
</aside>
<div class="main-wrapper">
<header class="top-header">
<button id="submit-btn" class="header-action" onclick="openSubmissionModal()" style="display:none">Submit Level</button>
<button id="admin-btn" class="header-action" onclick="openAdminPanel()" style="display:none">Admin</button>
<button class="account-btn" onclick="handleAccountClick()">
<img id="header-avatar" class="avatar-img" alt="Avatar">
<span id="header-username">Log In / Register</span>
</button>
</header>
<main class="content"><div id="level-details"></div></main>
</div>
</div>

<div class="modal" id="auth-modal"><div class="modal-content">
<h2 class="modal-title" id="auth-title">Log In</h2><div class="error-message" id="auth-error"></div>
<form id="auth-form" onsubmit="handleAuthSubmit(event)">
<div class="form-group" id="username-group" style="display:none"><label>Ingame Username</label><input type="text" id="auth-username"></div>
<div class="form-group"><label>Email</label><input type="email" id="auth-email" required></div>
<div class="form-group"><label>Password</label><input type="password" id="auth-password" required></div>
<div class="button-row"><button class="btn-primary" type="submit" id="auth-submit-btn">Log In</button><button class="btn-secondary" type="button" onclick="toggleAuthMode()" id="auth-toggle-btn">Need an account? Register</button></div>
<button class="btn-secondary" type="button" onclick="closeModal('auth-modal')" style="width:100%;margin-top:8px">Cancel</button>
</form></div></div>

<div class="modal" id="submission-modal"><div class="modal-content">
<h2 class="modal-title">Level einreichen</h2><div class="error-message" id="submission-error"></div>
<form onsubmit="submitLevel(event)">
<div class="form-grid">
<div class="form-group"><label>Level Name *</label><input id="s-name" required></div>
<div class="form-group"><label>Difficulty *</label><select id="s-difficulty" required></select></div>
<div class="form-group"><label>Tier (1–10) *</label><select id="s-tier" required></select></div>
<div class="form-group"><label>YouTube ID *</label><input id="s-youtube" required placeholder="z.B. JCAOQQu4Iy0"></div>
<div class="form-group"><label>Creator *</label><input id="s-creator" required></div>
<div class="form-group"><label>Publisher *</label><input id="s-publisher" required></div>
<div class="form-group"><label>Verifier *</label><input id="s-verifier" required></div>
<div class="form-group"><label>Original Verifier *</label><input id="s-original-verifier" required></div>
<div class="form-group full"><label>Beschreibung</label><textarea id="s-description"></textarea></div>
<hr class="form-group full" style="border-color:#2a2c3a">
<div class="form-group"><label>Dein Player-Name *</label><input id="s-player" required></div>
<div class="form-group"><label>Current Hardest (falls neuer Player)</label><input id="s-hardest"></div>
<div class="form-group full"><label>Beaten Extremes (falls neuer Player, mit Komma trennen)</label><input id="s-extremes"></div>
</div>
<div class="button-row"><button class="btn-primary" type="submit">Einreichen</button><button class="btn-secondary" type="button" onclick="closeModal('submission-modal')">Abbrechen</button></div>
</form></div></div>

<div class="modal" id="admin-modal"><div class="modal-content">
<h2 class="modal-title">Admin Panel</h2><div id="admin-content"></div>
<button class="btn-secondary" style="width:100%;margin-top:12px" onclick="closeModal('admin-modal')">Schließen</button>
</div></div>

<div class="modal" id="edit-modal"><div class="modal-content">
<h2 class="modal-title" id="edit-title">Bearbeiten</h2><div class="error-message" id="edit-error"></div>
<div id="edit-content"></div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyBaHc7pgi4RaKSYrL3X_BotZ8VB15XBKIY",
authDomain:"german-demonlist.firebaseapp.com",
projectId:"german-demonlist",
storageBucket:"german-demonlist.firebasestorage.app",
messagingSenderId:"502395064717",
appId:"1:502395064717:web:4c5919fed8ec30p48c5pc4",
measurementId:"G-78M8FVNYQX"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const DEFAULT_AVATAR="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23888888'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>";

const BASE_VALUES={"Easy Demon":1,"Medium Demon":2,"Hard Demon":3,"Insane Demon":5,"Extreme Demon":10};
const MULTIPLIERS={1:1,2:1.2,3:1.4,4:1.6,5:1.8,6:2,7:2.3,8:2.6,9:3,10:3.5};
const difficulties=Object.keys(BASE_VALUES);
let demons=[],players=[],submissions=[],currentUserData=null,currentTab="classic",isRegisterMode=false;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const calcPoints=(difficulty,tier)=>+(BASE_VALUES[difficulty]*(MULTIPLIERS[Number(tier)]||1)).toFixed(2);
const normalizeName=s=>String(s||"").trim().toLowerCase();
const isAdmin=()=>currentUserData&&(currentUserData.role==="admin"||currentUserData.role==="owner");
const isOwner=()=>currentUserData?.role==="owner";

function difficultyIcon(d){return {"Easy Demon":"easy.webp","Medium Demon":"medium.webp","Hard Demon":"hard.png","Insane Demon":"insane.png","Extreme Demon":"extreme.jpg"}[d]||""}

window.closeModal=id=>document.getElementById(id).classList.remove("active");
function openModal(id){document.getElementById(id).classList.add("active")}
window.handleAccountClick=()=>auth.currentUser?switchTab("profile"):openModal("auth-modal");
window.closeAuthModal=()=>closeModal("auth-modal");

window.toggleAuthMode=()=>{
isRegisterMode=!isRegisterMode;
document.getElementById("auth-title").textContent=isRegisterMode?"Register":"Log In";
document.getElementById("username-group").style.display=isRegisterMode?"block":"none";
document.getElementById("auth-submit-btn").textContent=isRegisterMode?"Register":"Log In";
document.getElementById("auth-toggle-btn").textContent=isRegisterMode?"Already have an account? Log In":"Need an account? Register";
};

window.handleAuthSubmit=async e=>{
e.preventDefault();const error=document.getElementById("auth-error");error.style.display="none";
try{
if(isRegisterMode){
const username=document.getElementById("auth-username").value.trim()||document.getElementById("auth-email").value.split("@")[0];
const cred=await createUserWithEmailAndPassword(auth,document.getElementById("auth-email").value,document.getElementById("auth-password").value);
await setDoc(doc(db,"users",cred.user.uid),{username,avatarUrl:DEFAULT_AVATAR,role:"user",createdAt:serverTimestamp()});
}else await signInWithEmailAndPassword(auth,document.getElementById("auth-email").value,document.getElementById("auth-password").value);
closeModal("auth-modal");
}catch(err){error.textContent=err.message;error.style.display="block"}
};

window.handleLogout=async()=>{await signOut(auth);currentUserData=null;switchTab("classic")};

onAuthStateChanged(auth,async user=>{
if(user){
const snap=await getDoc(doc(db,"users",user.uid));
currentUserData=snap.exists()?snap.data():{username:user.email.split("@")[0],avatarUrl:DEFAULT_AVATAR,role:"user"};
updateHeaderUI();
}else{currentUserData=null;updateHeaderUI()}
await loadData();
});

function updateHeaderUI(){
const avatar=document.getElementById("header-avatar"),name=document.getElementById("header-username");
avatar.src=currentUserData?.avatarUrl||DEFAULT_AVATAR;name.textContent=currentUserData?.username||"Log In / Register";
document.getElementById("submit-btn").style.display=currentUserData?"block":"none";
document.getElementById("admin-btn").style.display=isAdmin()?"block":"none";
}

async function loadData(){
try{
const dSnap=await getDocs(query(collection(db,"demons"),orderBy("rank")));
demons=dSnap.docs.map(x=>({id:x.id,...x.data()}));
}catch(e){demons=[]}
try{
const pSnap=await getDocs(query(collection(db,"players"),orderBy("placement")));
players=pSnap.docs.map(x=>({id:x.id,...x.data()}));
}catch(e){players=[]}
if(isAdmin()){try{const sSnap=await getDocs(query(collection(db,"submissions"),orderBy("createdAt","desc")));submissions=sSnap.docs.map(x=>({id:x.id,...x.data()}))}catch(e){submissions=[]}}
else submissions=[];
loadLevelList();
}

window.switchTab=tab=>{
currentTab=tab;document.getElementById("tab-classic").classList.toggle("active",tab==="classic");
document.getElementById("tab-players").classList.toggle("active",tab==="players");document.getElementById("search").value="";loadLevelList();
};

function loadLevelList(){
const el=document.getElementById("level-list");el.innerHTML="";
if(currentTab==="profile"){selectProfile();return}
const data=currentTab==="classic"?demons:players;
data.forEach((item,i)=>{
const li=document.createElement("li");li.className="level-item";li.onclick=()=>selectLevel(i);
li.innerHTML=`<span class="rank">#${currentTab==="classic"?item.rank:item.placement}</span><span>${esc(item.name)}</span>`;el.appendChild(li)
});
if(data.length)selectLevel(0);else document.getElementById("level-details").innerHTML="<h2>Noch keine Einträge vorhanden.</h2>";
}

function selectProfile(){
document.getElementById("level-details").innerHTML=`
<div style="max-width:700px">
<img src="${esc(currentUserData?.avatarUrl||DEFAULT_AVATAR)}" class="profile-avatar-large">
<h1 class="level-title" style="text-align:center">${esc(currentUserData?.username)}</h1>
<p class="description" style="text-align:center">My Profile</p>
<div class="info-card">
<div class="info-row"><span class="info-label">Role</span><span class="info-value">${esc(currentUserData?.role||"user")}</span></div>
<div class="info-row"><span class="info-label">Placement</span><span class="info-value">#${players.find(p=>normalizeName(p.name)===normalizeName(currentUserData?.username))?.placement||"-"}</span></div>
<div class="info-row"><span class="info-label">Points</span><span class="info-value">${players.find(p=>normalizeName(p.name)===normalizeName(currentUserData?.username))?.points||0}</span></div>
</div>
<div class="button-row"><button class="btn-secondary" onclick="changeAvatar()">Change Profile Picture</button><button class="btn-danger" onclick="handleLogout()">Log Out</button></div>
</div>`}

window.changeAvatar=async()=>{
const url=prompt("Bild-Link (URL):",currentUserData?.avatarUrl||"");if(!url||!auth.currentUser)return;
await updateDoc(doc(db,"users",auth.currentUser.uid),{avatarUrl:url});currentUserData.avatarUrl=url;updateHeaderUI();selectProfile()
};

function selectLevel(index){
document.querySelectorAll(".level-item").forEach((x,i)=>x.classList.toggle("active",i===index));
const c=document.getElementById("level-details");
if(currentTab==="classic"){
const d=demons[index];if(!d)return;
c.innerHTML=`<h1 class="level-title">#${d.rank} - ${esc(d.name)}</h1><p class="description">${esc(d.description)}</p>
<div class="video-container"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(d.youtubeId)}" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
<div class="info-card">
<div class="info-row"><span class="info-label">Difficulty</span><span class="info-value">${esc(d.difficulty)}</span></div>
<div class="info-row"><span class="info-label">Tier</span><span class="info-value">${d.tier}</span></div>
<div class="info-row"><span class="info-label">Points</span><span class="info-value highlight-name">${d.points}</span></div>
<div class="info-row"><span class="info-label">Publisher</span><span class="info-value">${esc(d.publisher)}</span></div>
<div class="info-row"><span class="info-label">Creator</span><span class="info-value">${esc(d.creator)}</span></div>
<div class="info-row"><span class="info-label">Verifier</span><span class="info-value">${esc(d.verifier)}</span></div>
<div class="info-row"><span class="info-label">Original Verifier</span><span class="info-value">${esc(d.originalVerifier)}</span></div>
<div class="info-row"><span class="info-label">Other Victors</span><span class="info-value">${(d.victors||[]).map(esc).join(", ")||"None"}</span></div>
</div>
${isAdmin()?`<div class="button-row"><button class="btn-primary" onclick="editDemon('${d.id}')">Level bearbeiten</button><button class="btn-danger" onclick="deleteDemon('${d.id}')">Löschen</button></div>`:""}`;
}else{
const p=players[index];if(!p)return;
c.innerHTML=`<h1 class="level-title">#${p.placement} - ${esc(p.name)}</h1><p class="description">Player Profile</p>
<div class="info-card">
<div class="info-row"><span class="info-label">Placement</span><span class="info-value">#${p.placement}</span></div>
<div class="info-row"><span class="info-label">Points</span><span class="info-value">${p.points}</span></div>
<div class="info-row"><span class="info-label">Current Hardest</span><span class="info-value highlight-name">${esc(p.currentHardest||"-")}</span></div>
<div class="info-row"><span class="info-label">Beaten Extremes</span><span class="info-value">${(p.beatenExtremes||[]).map(esc).join(", ")||"None"}</span></div>
</div>
${isAdmin()?`<div class="button-row"><button class="btn-primary" onclick="editPlayer('${p.id}')">Player bearbeiten</button><button class="btn-danger" onclick="deletePlayer('${p.id}')">Löschen</button></div>`:""}`;
}
}

window.filterLevels=()=>{
const q=document.getElementById("search").value.toLowerCase();
document.querySelectorAll(".level-item").forEach((x,i)=>{
const data=currentTab==="classic"?demons:players;x.style.display=data[i]?.name.toLowerCase().includes(q)?"flex":"none";
});
};

function fillSelects(){
document.getElementById("s-difficulty").innerHTML=difficulties.map(x=>`<option>${x}</option>`).join("");
document.getElementById("s-tier").innerHTML=Object.keys(MULTIPLIERS).map(x=>`<option value="${x}">${x} (${MULTIPLIERS[x]}×)</option>`).join("");
}
fillSelects();

window.openSubmissionModal=()=>{if(!auth.currentUser)return openModal("auth-modal");document.getElementById("submission-error").style.display="none";openModal("submission-modal")};

window.submitLevel=async e=>{
e.preventDefault();const err=document.getElementById("submission-error");err.style.display="none";
try{
const player=document.getElementById("s-player").value.trim(), existing=players.find(p=>normalizeName(p.name)===normalizeName(player));
const data={
type:"level",status:"pending",submittedBy:auth.currentUser.uid,submittedByUsername:player,
name:document.getElementById("s-name").value.trim(),difficulty:document.getElementById("s-difficulty").value,tier:Number(document.getElementById("s-tier").value),
youtubeId:document.getElementById("s-youtube").value.trim(),creator:document.getElementById("s-creator").value.trim(),publisher:document.getElementById("s-publisher").value.trim(),
verifier:document.getElementById("s-verifier").value.trim(),originalVerifier:document.getElementById("s-original-verifier").value.trim(),description:document.getElementById("s-description").value.trim(),
playerName:player,playerCurrentHardest:document.getElementById("s-hardest").value.trim(),playerBeatenExtremes:document.getElementById("s-extremes").value.split(",").map(x=>x.trim()).filter(Boolean),
existingPlayerId:existing?.id||null,createdAt:serverTimestamp()
};
await addDoc(collection(db,"submissions"),data);alert("Submission gesendet! Sie wird von einem Admin geprüft.");closeModal("submission-modal");await loadData();
}catch(ex){err.textContent=ex.message;err.style.display="block"}
};

window.openAdminPanel=async()=>{
if(!isAdmin())return;
await loadData();
let html=`<div class="admin-grid">
<div class="admin-card"><h3>Pending Submissions</h3><p>${submissions.filter(s=>s.status==="pending").length} offen</p></div>
<div class="admin-card"><h3>Levels</h3><p>${demons.length} veröffentlicht</p></div>
<div class="admin-card"><h3>Players</h3><p>${players.length} Spieler</p></div>
</div><h3 style="margin:18px 0 10px">Einreichungen</h3>`;
const pending=submissions.filter(s=>s.status==="pending");
html+=pending.length?pending.map(s=>`<div class="admin-card" style="margin-bottom:8px"><h3>${esc(s.name)} <span class="badge">${esc(s.difficulty)} · Tier ${s.tier}</span></h3><p class="small">eingereicht von ${esc(s.playerName||s.submittedByUsername)}</p><p>${esc(s.description||"")}</p><div class="button-row"><button class="btn-success" onclick="approveSubmission('${s.id}')">✓ Akzeptieren</button><button class="btn-danger" onclick="rejectSubmission('${s.id}')">Ablehnen</button></div></div>`).join(""):"<p class='small'>Keine offenen Einreichungen.</p>";
if(isOwner())html+=`<h3 style="margin:18px 0 10px">User / Admin Verwaltung</h3><div id="user-admin-list">Lade...</div>`;
document.getElementById("admin-content").innerHTML=html;openModal("admin-modal");
if(isOwner())loadUserAdminList();
};

async function loadUserAdminList(){
const snap=await getDocs(collection(db,"users"));const el=document.getElementById("user-admin-list");if(!el)return;
el.innerHTML=snap.docs.map(x=>{const u=x.data();return `<div class="admin-card" style="margin-bottom:8px"><b>${esc(u.username)}</b> <span class="badge">${esc(u.role||"user")}</span><div class="button-row">${u.role==="owner"?"":`<button class="btn-primary" onclick="setUserRole('${x.id}','${u.role==="admin"?"user":"admin"}')">${u.role==="admin"?"Admin entfernen":"Zum Admin machen"}</button>`}</div></div>`}).join("");
}
window.setUserRole=async(uid,role)=>{if(!isOwner())return;await updateDoc(doc(db,"users",uid),{role});await loadUserAdminList()};

window.approveSubmission=async sid=>{
if(!isAdmin())return;const s=submissions.find(x=>x.id===sid);if(!s)return;
const rank=Number(prompt("Placement für das neue Level:",String(demons.length+1)));if(!Number.isFinite(rank)||rank<1)return;
const duplicate=demons.find(d=>normalizeName(d.name)===normalizeName(s.name));
if(duplicate){
const victors=[...(duplicate.victors||[])];if(!victors.some(v=>normalizeName(v)===normalizeName(s.playerName)))victors.push(s.playerName);
await updateDoc(doc(db,"demons",duplicate.id),{victors,updatedAt:serverTimestamp()});
}else{
const demon={name:s.name,rank,difficulty:s.difficulty,tier:Number(s.tier),points:calcPoints(s.difficulty,s.tier),youtubeId:s.youtubeId,creator:s.creator,publisher:s.publisher,verifier:s.verifier,originalVerifier:s.originalVerifier,description:s.description,victors:[s.playerName],createdAt:serverTimestamp(),updatedAt:serverTimestamp()};
await addDoc(collection(db,"demons"),demon);
}
await updateDoc(doc(db,"submissions",sid),{status:"approved",reviewedBy:auth.currentUser.uid,reviewedAt:serverTimestamp()});
await ensurePlayerFromSubmission(s);await normalizeRankings();await loadData();openAdminPanel();
};

window.rejectSubmission=async sid=>{if(!isAdmin())return;await updateDoc(doc(db,"submissions",sid),{status:"rejected",reviewedBy:auth.currentUser.uid,reviewedAt:serverTimestamp()});await loadData();openAdminPanel()};

async function ensurePlayerFromSubmission(s){
let p=players.find(x=>normalizeName(x.name)===normalizeName(s.playerName));
if(!p){await addDoc(collection(db,"players"),{name:s.playerName,placement:999999,points:0,currentHardest:s.playerCurrentHardest||s.name,beatenExtremes:s.playerBeatenExtremes||[],createdAt:serverTimestamp()})}
await recalculatePlayers();
}
async function recalculatePlayers(){
const pSnap=await getDocs(collection(db,"players")),all=pSnap.docs.map(x=>({id:x.id,...x.data()}));
const dSnap=await getDocs(collection(db,"demons")),allD=dSnap.docs.map(x=>({id:x.id,...x.data()}));
for(const p of all){
const wins=allD.filter(d=>(d.victors||[]).some(v=>normalizeName(v)===normalizeName(p.name)));
const points=+wins.reduce((sum,d)=>sum+Number(d.points||calcPoints(d.difficulty,d.tier)),0).toFixed(2);
const hardest=wins.sort((a,b)=>Number(b.points)-Number(a.points))[0]?.name||p.currentHardest||"-";
await updateDoc(doc(db,"players",p.id),{points,currentHardest:hardest});
}
const updated=(await getDocs(collection(db,"players"))).docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>Number(b.points)-Number(a.points));
for(let i=0;i<updated.length;i++)await updateDoc(doc(db,"players",updated[i].id),{placement:i+1});
}
async function normalizeRankings(){
const snap=await getDocs(collection(db,"demons"));const all=snap.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>Number(a.rank)-Number(b.rank));
for(let i=0;i<all.length;i++)await updateDoc(doc(db,"demons",all[i].id),{rank:i+1,points:calcPoints(all[i].difficulty,all[i].tier)});
}

window.editDemon=id=>{
const d=demons.find(x=>x.id===id);if(!d)return;
document.getElementById("edit-title").textContent="Level bearbeiten";
document.getElementById("edit-content").innerHTML=`<div class="form-grid">
<div class="form-group"><label>Name</label><input id="e-name" value="${esc(d.name)}"></div><div class="form-group"><label>Placement</label><input id="e-rank" type="number" value="${d.rank}"></div>
<div class="form-group"><label>Difficulty</label><select id="e-diff">${difficulties.map(x=>`<option ${x===d.difficulty?"selected":""}>${x}</option>`).join("")}</select></div>
<div class="form-group"><label>Tier</label><select id="e-tier">${Object.keys(MULTIPLIERS).map(x=>`<option value="${x}" ${Number(x)===Number(d.tier)?"selected":""}>${x} (${MULTIPLIERS[x]}×)</option>`).join("")}</select></div>
<div class="form-group"><label>Creator</label><input id="e-creator" value="${esc(d.creator)}"></div><div class="form-group"><label>Publisher</label><input id="e-publisher" value="${esc(d.publisher)}"></div>
<div class="form-group"><label>Verifier</label><input id="e-verifier" value="${esc(d.verifier)}"></div><div class="form-group"><label>Original Verifier</label><input id="e-original" value="${esc(d.originalVerifier)}"></div>
<div class="form-group"><label>YouTube ID</label><input id="e-youtube" value="${esc(d.youtubeId)}"></div><div class="form-group full"><label>Beschreibung</label><textarea id="e-description">${esc(d.description)}</textarea></div>
<div class="form-group full"><label>Other Victors (Komma getrennt)</label><input id="e-victors" value="${esc((d.victors||[]).join(", "))}"></div></div>
<div class="button-row"><button class="btn-primary" onclick="saveDemon('${id}')">Speichern</button><button class="btn-secondary" onclick="closeModal('edit-modal')">Abbrechen</button></div>`;
openModal("edit-modal");
};
window.saveDemon=async id=>{
const diff=document.getElementById("e-diff").value,tier=Number(document.getElementById("e-tier").value);
const victors=document.getElementById("e-victors").value.split(",").map(x=>x.trim()).filter(Boolean);
await updateDoc(doc(db,"demons",id),{name:document.getElementById("e-name").value.trim(),rank:Number(document.getElementById("e-rank").value),difficulty:diff,tier,points:calcPoints(diff,tier),creator:document.getElementById("e-creator").value.trim(),publisher:document.getElementById("e-publisher").value.trim(),verifier:document.getElementById("e-verifier").value.trim(),originalVerifier:document.getElementById("e-original").value.trim(),youtubeId:document.getElementById("e-youtube").value.trim(),description:document.getElementById("e-description").value.trim(),victors,updatedAt:serverTimestamp()});
await normalizeRankings();await recalculatePlayers();closeModal("edit-modal");await loadData();
};
window.deleteDemon=async id=>{if(!isAdmin()||!confirm("Level wirklich löschen?"))return;await deleteDoc(doc(db,"demons",id));await normalizeRankings();await recalculatePlayers();await loadData()};

window.editPlayer=id=>{
const p=players.find(x=>x.id===id);if(!p)return;
document.getElementById("edit-title").textContent="Player bearbeiten";
document.getElementById("edit-content").innerHTML=`<div class="form-grid">
<div class="form-group"><label>Name</label><input id="p-name" value="${esc(p.name)}"></div><div class="form-group"><label>Placement</label><input id="p-placement" type="number" value="${p.placement}"></div>
<div class="form-group full"><label>Current Hardest</label><input id="p-hardest" value="${esc(p.currentHardest||"")}"></div>
<div class="form-group full"><label>Beaten Extremes (Komma getrennt)</label><input id="p-extremes" value="${esc((p.beatenExtremes||[]).join(", "))}"></div></div>
<div class="button-row"><button class="btn-primary" onclick="savePlayer('${id}')">Speichern</button><button class="btn-secondary" onclick="closeModal('edit-modal')">Abbrechen</button></div>`;
openModal("edit-modal");
};
window.savePlayer=async id=>{
await updateDoc(doc(db,"players",id),{name:document.getElementById("p-name").value.trim(),placement:Number(document.getElementById("p-placement").value),currentHardest:document.getElementById("p-hardest").value.trim(),beatenExtremes:document.getElementById("p-extremes").value.split(",").map(x=>x.trim()).filter(Boolean)});
await recalculatePlayers();closeModal("edit-modal");await loadData();
};
window.deletePlayer=async id=>{if(!isAdmin()||!confirm("Player wirklich löschen?"))return;await deleteDoc(doc(db,"players",id));await recalculatePlayers();await loadData()};

window.onload=async()=>{await loadData()};
</script>
</body>
</html>
