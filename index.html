<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonlist</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #121318;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            flex-direction: column; /* Gut für Smartphones */
        }

        @media (min-width: 600px) {
            .app-container {
                flex-direction: row; /* Für Tablet / PC */
            }
        }

        /* Sidebar / Liste */
        .sidebar {
            width: 100%;
            background-color: #1a1b23;
            border-bottom: 1px solid #2a2c3a;
            display: flex;
            flex-direction: column;
            padding: 15px;
            max-height: 40vh; /* Auf dem Handy nimmt die Liste oben max 40% Platz ein */
        }

        @media (min-width: 600px) {
            .sidebar {
                width: 320px;
                max-height: 100vh;
                border-right: 1px solid #2a2c3a;
                border-bottom: none;
            }
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }

        .logo-highlight {
            color: #ff6b00;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .tab {
            background: none;
            border: none;
            color: #888;
            border-bottom: 2px solid transparent;
            padding: 5px 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab.active {
            color: #ff6b00;
            border-bottom: 2px solid #ff6b00;
        }

        #search {
            width: 100%;
            padding: 8px 12px;
            background-color: #121318;
            border: 1px solid #2a2c3a;
            border-radius: 6px;
            color: white;
            margin-bottom: 10px;
        }

        .level-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .level-item {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 5px;
            cursor: pointer;
            background-color: #21232e;
            display: flex;
            gap: 10px;
        }

        .level-item.active {
            background-color: #ff6b00;
            color: white;
        }

        .rank {
            font-weight: bold;
        }

        /* Main Layout Header & Content */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-header {
            background-color: #1a1b23;
            border-bottom: 1px solid #2a2c3a;
            padding: 10px 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .account-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #21232e;
            border: 1px solid #2a2c3a;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .account-btn:hover {
            background-color: #2a2c3a;
        }

        .avatar-img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #121318;
        }

        /* Contentbereich */
        .content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .level-title {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .description {
            color: #aaa;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 650px;
            aspect-ratio: 16 / 9;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .info-card {
            background-color: #1a1b23;
            padding: 15px;
            border-radius: 8px;
            max-width: 650px;
            border: 1px solid #2a2c3a;
        }

        .info-row {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2c3a;
            padding-bottom: 6px;
            font-size: 14px;
        }

        .info-label {
            color: #888;
            font-weight: bold;
        }

        .info-value {
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .difficulty-icon {
            height: 24px;
            width: auto;
        }

        .my-name {
            color: #ff6b00;
            font-weight: bold;
        }

        /* Modal / Dialog Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: #1a1b23;
            border: 1px solid #2a2c3a;
            border-radius: 8px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #fff;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background-color: #121318;
            border: 1px solid #2a2c3a;
            border-radius: 6px;
            color: #fff;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #aaa;
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            background-color: #ff6b00;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-secondary {
            width: 100%;
            padding: 8px;
            background-color: transparent;
            border: 1px solid #2a2c3a;
            border-radius: 6px;
            color: #888;
            cursor: pointer;
        }

        .error-message {
            color: #ff4d4d;
            font-size: 12px;
            margin-bottom: 10px;
            display: none;
        }

        .profile-avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px auto;
            display: block;
            border: 2px solid #ff6b00;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Navigation / Liste -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-highlight">German</span> Demonlist
            </div>
            <div class="tabs">
                <button class="tab active" id="tab-classic" onclick="switchTab('classic')">CLASSIC</button>
                <button class="tab" id="tab-players" onclick="switchTab('players')">PLAYERS</button>
            </div>
            <input type="text" id="search" placeholder="Search..." onkeyup="filterLevels()">
            <ul id="level-list" class="level-list"></ul>
        </aside>

        <!-- Main Wrapper mit Header oben -->
        <div class="main-wrapper">
            <header class="top-header">
                <button class="account-btn" onclick="handleAccountClick()">
                    <img src="https://via.placeholder.com/150/21232e/888888?text=User" id="header-avatar" class="avatar-img" alt="Avatar">
                    <span id="header-username">Log In / Register</span>
                </button>
            </header>

            <!-- Main Details -->
            <main class="content">
                <div id="level-details"></div>
            </main>
        </div>
    </div>

    <!-- Login / Register Modal -->
    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <h2 class="modal-title" id="auth-title">Log In</h2>
            <div class="error-message" id="auth-error"></div>
            
            <form id="auth-form" onsubmit="handleAuthSubmit(event)">
                <div class="form-group" id="username-group" style="display: none;">
                    <label for="auth-username">Ingame Username</label>
                    <input type="text" id="auth-username" placeholder="e.g. Derlery5">
                </div>
                <div class="form-group">
                    <label for="auth-email">Email</label>
                    <input type="email" id="auth-email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="auth-password">Password</label>
                    <input type="password" id="auth-password" required placeholder="••••••••">
                </div>
                <div class="checkbox-group" id="remember-group">
                    <input type="checkbox" id="auth-remember" checked>
                    <label for="auth-remember">Angemeldet bleiben</label>
                </div>

                <button type="submit" class="btn-primary" id="auth-submit-btn">Log In</button>
                <button type="button" class="btn-secondary" onclick="toggleAuthMode()" id="auth-toggle-btn">Need an account? Register</button>
                <button type="button" class="btn-secondary" onclick="closeAuthModal()" style="margin-top: 5px;">Cancel</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Deine Firebase-Konfiguration
        const firebaseConfig = {
            apiKey: "AIzaSyDaHc7pgi4RaKSYrL3X_BotZ8VB15XBK1Y",
            authDomain: "german-demonlist.firebaseapp.com",
            projectId: "german-demonlist",
            storageBucket: "german-demonlist.firebasestorage.app",
            messagingSenderId: "502395064717",
            appId: "1:502395064717:web:4c5919fed8ec30p48c5pc4",
            measurementId: "G-78M8FVNYQX"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Standard Profilbild URL (Klassisches Standard-Bild)
        const DEFAULT_AVATAR = "https://via.placeholder.com/150/21232e/888888?text=User";

        let currentUserData = null;
        let isRegisterMode = false;

        // Auth Status-Änderung überwachen
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Daten aus Firestore laden
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    currentUserData = userDoc.data();
                } else {
                    currentUserData = {
                        username: user.email.split("@")[0],
                        avatarUrl: DEFAULT_AVATAR
                    };
                }
                updateHeaderUI(true);
            } else {
                currentUserData = null;
                updateHeaderUI(false);
            }
        });

        function updateHeaderUI(isLoggedIn) {
            const avatar = document.getElementById("header-avatar");
            const name = document.getElementById("header-username");

            if (isLoggedIn && currentUserData) {
                avatar.src = currentUserData.avatarUrl || DEFAULT_AVATAR;
                name.textContent = currentUserData.username || "Profile";
            } else {
                avatar.src = DEFAULT_AVATAR;
                name.textContent = "Log In / Register";
            }
        }

        window.handleAccountClick = function() {
            if (auth.currentUser) {
                switchTab('profile');
            } else {
                openAuthModal();
            }
        };

        function openAuthModal() {
            document.getElementById("auth-modal").classList.add("active");
            document.getElementById("auth-error").style.display = "none";
        }

        window.closeAuthModal = function() {
            document.getElementById("auth-modal").classList.remove("active");
        };

        window.toggleAuthMode = function() {
            isRegisterMode = !isRegisterMode;
            document.getElementById("auth-title").textContent = isRegisterMode ? "Register" : "Log In";
            document.getElementById("username-group").style.display = isRegisterMode ? "block" : "none";
            document.getElementById("auth-submit-btn").textContent = isRegisterMode ? "Register" : "Log In";
            document.getElementById("auth-toggle-btn").textContent = isRegisterMode ? "Already have an account? Log In" : "Need an account? Register";
            document.getElementById("auth-error").style.display = "none";
        };

        window.handleAuthSubmit = async function(e) {
            e.preventDefault();
            const email = document.getElementById("auth-email").value;
            const password = document.getElementById("auth-password").value;
            const remember = document.getElementById("auth-remember").checked;
            const errorElement = document.getElementById("auth-error");

            errorElement.style.display = "none";

            try {
                // Angemeldet bleiben Status setzen
                const persistence = remember ? browserLocalPersistence : browserSessionPersistence;
                await setPersistence(auth, persistence);

                if (isRegisterMode) {
                    const username = document.getElementById("auth-username").value.trim() || email.split("@")[0];
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    // Firestore Profil anlegen
                    await setDoc(doc(db, "users", user.uid), {
                        username: username,
                        avatarUrl: DEFAULT_AVATAR,
                        createdAt: new Date().toISOString()
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }

                closeAuthModal();
            } catch (error) {
                errorElement.textContent = error.message;
                errorElement.style.display = "block";
            }
        };

        window.handleLogout = async function() {
            await signOut(auth);
            switchTab('classic');
        };

        window.updateAvatarUrl = async function() {
            const newUrl = prompt("Gib den Bild-Link (URL) für dein neues Profilbild ein:", currentUserData?.avatarUrl || "");
            if (newUrl && auth.currentUser) {
                try {
                    await updateDoc(doc(db, "users", auth.currentUser.uid), {
                        avatarUrl: newUrl
                    });
                    currentUserData.avatarUrl = newUrl;
                    updateHeaderUI(true);
                    selectLevel(0); // Profil neu laden
                } catch (e) {
                    alert("Fehler beim Speichern des Profilbilds: " + e.message);
                }
            }
        };

        // Tab System Logik
        window.currentTab = "classic";

        const demons = [
            {
                rank: 1,
                name: "Cataclysm",
                difficulty: "Extreme Demon",
                difficultyIcon: "extreme.jpg",
                publisher: "Ggb0y",
                creator: "Ggb0y",
                myVerifier: "Derlery5",        
                originalVerifier: "Riot",    
                victors: ["Player1", "Player2", "Player3"],
                youtubeId: "Kd-G_pd3OPw",   
                description: "~6200 Attempts."
            },
            {
                rank: 2,
                name: "Sweather Weather",
                difficulty: "Extreme Demon",
                difficultyIcon: "extreme.jpg",
                publisher: "VelYT",
                creator: "VelYT",
                myVerifier: "Limbu",
                originalVerifier: "Xfire",
                victors: ["Player 1", "Player 2"],
                youtubeId: "7CZFG9oisPI",
                description: "Deep Level"
            },
            {
                rank: 3,
                name: "ACU",
                difficulty: "Extreme Demon",
                difficultyIcon: "extreme.jpg",
                publisher: "neigefeu",
                creator: "neigefeu",
                myVerifier: "Derlery5",
                originalVerifier: "neigefeu",
                victors: ["Limbu"],
                youtubeId: "riMBe0u4FpU",
                description: "Einfachster Extreme."
            },
            {
                rank: 4,
                name: "Poltergeist",
                difficulty: "Insane Demon",
                difficultyIcon: "insane.png",
                publisher: "Andromeda",
                creator: "Andromeda",
                myVerifier: "Derlery5",        
                originalVerifier: "Andromeda",    
                victors: ["Player1", "Player2", "Player3"],
                youtubeId: "uUP6l68Tsg0",   
                description: "Cooles Level"
            },
            {
                rank: 5,
                name: "Inane Demon",
                difficulty: "Insane Demon",
                difficultyIcon: "insane.png",
                publisher: "KiwiPenguin",
                creator: "KiwiPenguin",
                myVerifier: "Derlery5",        
                originalVerifier: "KiwiPenguin",    
                victors: ["Player1", "Player2", "Player3"],
                youtubeId: "OjRwvdtjuqE",   
                description: "Funny April Joke"
            },
            {
                rank: 6,
                name: "Stalemate",
                difficulty: "Insane Demon",
                difficultyIcon: "insane.png",
                publisher: "Nox",
                creator: "Nox",
                myVerifier: "Derlery5",        
                originalVerifier: "Nox",    
                victors: ["Player1", "Player2", "Player3"],
                youtubeId: "h0ePMjhnUNI",   
                description: "1.9"
            },
            {
                rank: 7,
                name: "Windy Landscape",
                difficulty: "Insane Demon",
                difficultyIcon: "insane.png",
                publisher: "WOOGI1411",
                creator: "WOOGI1411",
                myVerifier: "Derlery5",        
                originalVerifier: "GuitarHeroStyles",    
                victors: ["Player1", "Player2", "Player3"],
                youtubeId: "UWUmUDGY31k",   
                description: "Ikonisch"
            },
            {
                rank: 8,
                name: "CraZy",
                difficulty: "Insane Demon",
                difficultyIcon: "insane.png",
                publisher: "DavJT",
                creator: "DavJT",
                myVerifier: "Derlery5",        
                originalVerifier: "DavJT",    
                victors: ["Player1", "Player2", "Player3"],
                youtubeId: "InQNiq9IKxA",   
                description: "Tuff"
            },
            {
                rank: 9,
                name: "CraZy II",
                difficulty: "Insane Demon",
                difficultyIcon: "insane.png",
                publisher: "DavJT",
                creator: "DavJT & N R G",
                myVerifier: "Derlery5",        
                originalVerifier: "DavJT",    
                victors: ["Player1", "Player2", "Player3"],
                youtubeId: "A1YYMgkAzWI",   
                description: "Tuff II"
            },
            {
                rank: 10,
                name: "KATAMARI",
                difficulty: "Hard Demon",
                difficultyIcon: "hard.webp",
                publisher: "MonkeyInABowl",
                creator: "MonkeyInABowl",
                myVerifier: "Derlery5",        
                originalVerifier: "MonkeyInABowl",    
                victors: ["Player1", "Player2", "Player3"],
                youtubeId: "XD-wZE7MMKE",   
                description: "Bruh"
            },
        ];

        const players = [
            {
                placement: 1,
                name: "Derlery5",
                currentHardest: "Cataclysm",
                points: 71,
                beatenExtremes: ["Cataclysm", "ACU"]
            },
            {
                placement: 2,
                name: "lLimbu",
                currentHardest: "Sweather Weather",
                points: 30,
                beatenExtremes: ["Sweather Weather", "ACU"]
            },
            {
                placement: 3,
                name: "qChrc",
                currentHardest: "Blackfire Backfire",
                points: 0,
                beatenExtremes: []
            }
        ];

        window.switchTab = function(tab) {
            window.currentTab = tab;
            document.getElementById("tab-classic").classList.toggle("active", tab === "classic");
            document.getElementById("tab-players").classList.toggle("active", tab === "players");
            document.getElementById("search").value = "";
            loadLevelList();
        };

        function loadLevelList() {
            const listElement = document.getElementById("level-list");
            listElement.innerHTML = "";

            if (window.currentTab === "profile") {
                selectLevel(0);
                return;
            }

            const data = window.currentTab === "classic" ? demons : players;

            data.forEach((item, index) => {
                const li = document.createElement("li");
                li.className = `level-item ${index === 0 ? 'active' : ''}`;
                li.onclick = () => selectLevel(index);

                const num = window.currentTab === "classic" ? item.rank : item.placement;
                li.innerHTML = `<span class="rank">#${num}</span> <span class="name">${item.name}</span>`;
                listElement.appendChild(li);
            });

            if (data.length > 0) {
                selectLevel(0);
            }
        }

        function selectLevel(index) {
            const items = document.querySelectorAll(".level-item");
            items.forEach((item, i) => {
                item.classList.toggle("active", i === index);
            });

            const detailsContainer = document.getElementById("level-details");

            if (window.currentTab === "profile") {
                const username = currentUserData?.username || "Player";
                const matchingPlayer = players.find(p => p.name.toLowerCase() === username.toLowerCase()) || {
                    placement: "-",
                    points: 0,
                    currentHardest: "-",
                    beatenExtremes: []
                };

                detailsContainer.innerHTML = `
                    <img src="${currentUserData?.avatarUrl || DEFAULT_AVATAR}" class="profile-avatar-large" alt="Avatar">
                    <h1 class="level-title" style="text-align: center;">${username}</h1>
                    <p class="description" style="text-align: center;">My Profile</p>

                    <div style="text-align: center; margin-bottom: 20px;">
                        <button class="btn-primary" style="width: auto; padding: 6px 15px; font-size: 13px;" onclick="updateAvatarUrl()">Change Profile Picture</button>
                    </div>

                    <div class="info-card" style="margin: 0 auto;">
                        <div class="info-row">
                            <span class="info-label">Placement:</span>
                            <span class="info-value">#${matchingPlayer.placement}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Points:</span>
                            <span class="info-value">${matchingPlayer.points}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Current Hardest:</span>
                            <span class="info-value my-name">${matchingPlayer.currentHardest}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Beaten Extremes:</span>
                            <span class="info-value">${matchingPlayer.beatenExtremes.length > 0 ? matchingPlayer.beatenExtremes.join(", ") : "None"}</span>
                        </div>
                    </div>

                    <div style="text-align: center; margin-top: 25px;">
                        <button class="btn-secondary" style="width: auto; padding: 8px 20px; color: #ff4d4d; border-color: #ff4d4d;" onclick="handleLogout()">Log Out</button>
                    </div>
                `;
            } else if (window.currentTab === "classic") {
                const demon = demons[index];
                detailsContainer.innerHTML = `
                    <h1 class="level-title">#${demon.rank} - ${demon.name}</h1>
                    <p class="description">${demon.description}</p>
                    
                    <div class="video-container">
                        <iframe src="https://www.youtube-nocookie.com/embed/${demon.youtubeId}" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    </div>

                    <div class="info-card">
                        <div class="info-row">
                            <span class="info-label">Difficulty:</span>
                            <span class="info-value">
                                <img src="${demon.difficultyIcon}" alt="${demon.difficulty}" class="difficulty-icon">
                                ${demon.difficulty}
                            </span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Publisher:</span>
                            <span class="info-value">${demon.publisher}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Creator:</span>
                            <span class="info-value">${demon.creator}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Verifier:</span>
                            <span class="info-value my-name">${demon.myVerifier}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Original Verifier:</span>
                            <span class="info-value">${demon.originalVerifier}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Other Victors:</span>
                            <span class="info-value">${demon.victors.join(", ")}</span>
                        </div>
                    </div>
                `;
            } else {
                const player = players[index];
                detailsContainer.innerHTML = `
                    <h1 class="level-title">#${player.placement} - ${player.name}</h1>
                    <p class="description">Player Profile</p>

                    <div class="info-card">
                        <div class="info-row">
                            <span class="info-label">Placement:</span>
                            <span class="info-value">#${player.placement}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Points:</span>
                            <span class="info-value">${player.points}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Current Hardest:</span>
                            <span class="info-value my-name">${player.currentHardest}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Beaten Extremes:</span>
                            <span class="info-value">${player.beatenExtremes.length > 0 ? player.beatenExtremes.join(", ") : "None"}</span>
                        </div>
                    </div>
                `;
            }
        }

        window.filterLevels = function() {
            const query = document.getElementById("search").value.toLowerCase();
            const items = document.querySelectorAll(".level-item");
            const data = window.currentTab === "classic" ? demons : players;

            items.forEach((item, index) => {
                if (data[index]) {
                    const text = data[index].name.toLowerCase();
                    item.style.display = text.includes(query) ? "flex" : "none";
                }
            });
        };

        window.onload = loadLevelList;
    </script>
</body>
</html>
