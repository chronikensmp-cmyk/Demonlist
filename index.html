<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonlist</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #121318;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            flex-direction: column; /* Gut für Smartphones */
        }

        @media (min-width: 600px) {
            .app-container {
                flex-direction: row; /* Für Tablet / PC */
            }
        }

        /* Sidebar / Liste */
        .sidebar {
            width: 100%;
            background-color: #1a1b23;
            border-bottom: 1px solid #2a2c3a;
            display: flex;
            flex-direction: column;
            padding: 15px;
            max-height: 40vh; /* Auf dem Handy nimmt die Liste oben max 40% Platz ein */
        }

        @media (min-width: 600px) {
            .sidebar {
                width: 320px;
                max-height: 100vh;
                border-right: 1px solid #2a2c3a;
                border-bottom: none;
            }
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }

        .logo-highlight {
            color: #ff6b00;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .tab {
            background: none;
            border: none;
            color: #888;
            border-bottom: 2px solid transparent;
            padding: 5px 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab.active {
            color: #ff6b00;
            border-bottom: 2px solid #ff6b00;
        }

        #search {
            width: 100%;
            padding: 8px 12px;
            background-color: #121318;
            border: 1px solid #2a2c3a;
            border-radius: 6px;
            color: white;
            margin-bottom: 10px;
        }

        .level-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .level-item {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 5px;
            cursor: pointer;
            background-color: #21232e;
            display: flex;
            gap: 10px;
        }

        .level-item.active {
            background-color: #ff6b00;
            color: white;
        }

        .rank {
            font-weight: bold;
        }

        /* Contentbereich */
        .content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .level-title {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .description {
            color: #aaa;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 650px;
            aspect-ratio: 16 / 9;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .info-card {
            background-color: #1a1b23;
            padding: 15px;
            border-radius: 8px;
            max-width: 650px;
            border: 1px solid #2a2c3a;
        }

        .info-row {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2c3a;
            padding-bottom: 6px;
            font-size: 14px;
        }

        .info-label {
            color: #888;
            font-weight: bold;
        }

        .info-value {
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .difficulty-icon {
            height: 24px;
            width: auto;
        }

        .my-name {
            color: #ff6b00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Navigation / Liste -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-highlight">German</span> Demonlist
            </div>
            <div class="tabs">
                <button class="tab active" id="tab-classic" onclick="switchTab('classic')">CLASSIC</button>
                <button class="tab" id="tab-players" onclick="switchTab('players')">PLAYERS</button>
            </div>
            <input type="text" id="search" placeholder="Search..." onkeyup="filterLevels()">
            <ul id="level-list" class="level-list"></ul>
        </aside>

        <!-- Main Details -->
        <main class="content">
            <div id="level-details"></div>
        </main>
    </div>

    <script>
        let currentTab = "classic"; // 'classic' oder 'players'

        const demons = [
            {
                rank: 1,
                name: "Cataclysm",
                difficulty: "Extreme Demon",
                difficultyIcon: "extreme.jpg",
                publisher: "Ggb0y",
                creator: "Ggb0y",
                myVerifier: "Derlery5",        
                originalVerifier: "Riot",    
                victors: ["Player1", "Player2", "Player3"],
                youtubeId: "Kd-G_pd3OPw",   
                description: "~6200 Attempts."
            },
            {
                rank: 2,
                name: "Sweather Weather",
                difficulty: "Extreme Demon",
                difficultyIcon: "extreme.jpg",
                publisher: "VelYT",
                creator: "VelYT",
                myVerifier: "Limbu",
                originalVerifier: "Xfire",
                victors: ["Player 1", "Player 2"],
                youtubeId: "7CZFG9oisPI",
                description: "Deep Level"
            },
            {
                rank: 3,
                name: "ACU",
                difficulty: "Extreme Demon",
                difficultyIcon: "extreme.jpg",
                publisher: "neigefeu",
                creator: "neigefeu",
                myVerifier: "Derlery5",
                originalVerifier: "neigefeu",
                victors: ["Limbu"],
                youtubeId: "riMBe0u4FpU",
                description: "Einfachster Extreme."
            },
            {
                rank: 4,
                name: "Poltergeist",
                difficulty: "Insane Demon",
                difficultyIcon: "insane.png",
                publisher: "Andromeda",
                creator: "Andromeda",
                myVerifier: "Derlery5",        
                originalVerifier: "Andromeda",    
                victors: ["Player1", "Player2", "Player3"],
                youtubeId: "uUP6l68Tsg0",   
                description: "Cooles Level"
            },
            {
                rank: 5,
                name: "Inane Demon",
                difficulty: "Insane Demon",
                difficultyIcon: "insane.png",
                publisher: "KiwiPenguin",
                creator: "KiwiPenguin",
                myVerifier: "Derlery5",        
                originalVerifier: "KiwiPenguin",    
                victors: ["Player1", "Player2", "Player3"],
                youtubeId: "OjRwvdtjuqE",   
                description: "Funny April Joke"
            },
            {
                rank: 6,
                name: "Stalemate",
                difficulty: "Insane Demon",
                difficultyIcon: "insane.png",
                publisher: "Nox",
                creator: "Nox",
                myVerifier: "Derlery5",        
                originalVerifier: "Nox",    
                victors: ["Player1", "Player2", "Player3"],
                youtubeId: "h0ePMjhnUNI",   
                description: "1.9"
            },
            {
                rank: 7,
                name: "Windy Landscape",
                difficulty: "Insane Demon",
                difficultyIcon: "insane.png",
                publisher: "WOOGI1411",
                creator: "WOOGI1411",
                myVerifier: "Derlery5",        
                originalVerifier: "GuitarHeroStyles",    
                victors: ["Player1", "Player2", "Player3"],
                youtubeId: "UWUmUDGY31k",   
                description: "Ikonisch"
            },
            {
                rank: 8,
                name: "CraZy",
                difficulty: "Insane Demon",
                difficultyIcon: "insane.png",
                publisher: "DavJT",
                creator: "DavJT",
                myVerifier: "Derlery5",        
                originalVerifier: "DavJT",    
                victors: ["Player1", "Player2", "Player3"],
                youtubeId: "InQNiq9IKxA",   
                description: "Tuff"
            },
            {
                rank: 9,
                name: "CraZy II",
                difficulty: "Insane Demon",
                difficultyIcon: "insane.png",
                publisher: "DavJT",
                creator: "DavJT & N R G",
                myVerifier: "Derlery5",        
                originalVerifier: "DavJT",    
                victors: ["Player1", "Player2", "Player3"],
                youtubeId: "A1YYMgkAzWI",   
                description: "Tuff II"
            },
            {
                rank: 10,
                name: "KATAMARI",
                difficulty: "Hard Demon",
                difficultyIcon: "hard.webp",
                publisher: "MonkeyInABowl",
                creator: "MonkeyInABowl",
                myVerifier: "Derlery5",        
                originalVerifier: "MonkeyInABowl",    
                victors: ["Player1", "Player2", "Player3"],
                youtubeId: "XD-wZE7MMKE",   
                description: "Bruh"
            },
        ];

        const players = [
            {
                placement: 1,
                name: "Derlery5",
                currentHardest: "Cataclysm",
                points: 71,
                beatenExtremes: ["Cataclysm", "ACU"]
            },
            {
                placement: 2,
                name: "lLimbu",
                currentHardest: "Sweather Weather",
                points: 30,
                beatenExtremes: ["Sweather Weather", "ACU"]
            },
            {
                placement: 3,
                name: "qChrc",
                currentHardest: "Blackfire Backfire",
                points: 0,
                beatenExtremes: []
            }
        ];

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById("tab-classic").classList.toggle("active", tab === "classic");
            document.getElementById("tab-players").classList.toggle("active", tab === "players");
            document.getElementById("search").value = "";
            loadLevelList();
        }

        function loadLevelList() {
            const listElement = document.getElementById("level-list");
            listElement.innerHTML = "";

            const data = currentTab === "classic" ? demons : players;

            data.forEach((item, index) => {
                const li = document.createElement("li");
                li.className = `level-item ${index === 0 ? 'active' : ''}`;
                li.onclick = () => selectLevel(index);

                const num = currentTab === "classic" ? item.rank : item.placement;
                li.innerHTML = `<span class="rank">#${num}</span> <span class="name">${item.name}</span>`;
                listElement.appendChild(li);
            });

            if (data.length > 0) {
                selectLevel(0);
            }
        }

        function selectLevel(index) {
            const items = document.querySelectorAll(".level-item");
            items.forEach((item, i) => {
                item.classList.toggle("active", i === index);
            });

            const detailsContainer = document.getElementById("level-details");

            if (currentTab === "classic") {
                const demon = demons[index];
                detailsContainer.innerHTML = `
                    <h1 class="level-title">#${demon.rank} - ${demon.name}</h1>
                    <p class="description">${demon.description}</p>
                    
                    <div class="video-container">
                        <iframe src="https://www.youtube-nocookie.com/embed/${demon.youtubeId}" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    </div>

                    <div class="info-card">
                        <div class="info-row">
                            <span class="info-label">Difficulty:</span>
                            <span class="info-value">
                                <img src="${demon.difficultyIcon}" alt="${demon.difficulty}" class="difficulty-icon">
                                ${demon.difficulty}
                            </span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Publisher:</span>
                            <span class="info-value">${demon.publisher}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Creator:</span>
                            <span class="info-value">${demon.creator}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Verifier:</span>
                            <span class="info-value my-name">${demon.myVerifier}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Original Verifier:</span>
                            <span class="info-value">${demon.originalVerifier}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Other Victors:</span>
                            <span class="info-value">${demon.victors.join(", ")}</span>
                        </div>
                    </div>
                `;
            } else {
                const player = players[index];
                detailsContainer.innerHTML = `
                    <h1 class="level-title">#${player.placement} - ${player.name}</h1>
                    <p class="description">Player Profile</p>

                    <div class="info-card">
                        <div class="info-row">
                            <span class="info-label">Placement:</span>
                            <span class="info-value">#${player.placement}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Points:</span>
                            <span class="info-value">${player.points}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Current Hardest:</span>
                            <span class="info-value my-name">${player.currentHardest}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Beaten Extremes:</span>
                            <span class="info-value">${player.beatenExtremes.length > 0 ? player.beatenExtremes.join(", ") : "None"}</span>
                        </div>
                    </div>
                `;
            }
        }

        function filterLevels() {
            const query = document.getElementById("search").value.toLowerCase();
            const items = document.querySelectorAll(".level-item");
            const data = currentTab === "classic" ? demons : players;

            items.forEach((item, index) => {
                const text = data[index].name.toLowerCase();
                item.style.display = text.includes(query) ? "flex" : "none";
            });
        }

        window.onload = loadLevelList;
    </script>
</body>
</html>
