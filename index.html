<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Demonlist</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121318; color: #e0e0e0; height: 100vh; overflow: hidden; }
        .app-container { display: flex; height: 100vh; flex-direction: column; }
        @media (min-width: 600px) { .app-container { flex-direction: row; } }

        .sidebar { width: 100%; background-color: #1a1b23; border-bottom: 1px solid #2a2c3a; display: flex; flex-direction: column; padding: 15px; max-height: 40vh; }
        @media (min-width: 600px) { .sidebar { width: 320px; max-height: 100vh; border-right: 1px solid #2a2c3a; border-bottom: none; } }

        .logo { font-size: 22px; font-weight: bold; color: #fff; margin-bottom: 10px; cursor: pointer; }
        .logo-highlight { color: #ff6b00; }
        .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
        .tab { background: none; border: none; color: #888; border-bottom: 2px solid transparent; padding: 5px 10px; font-weight: bold; cursor: pointer; }
        .tab.active { color: #ff6b00; border-bottom: 2px solid #ff6b00; }
        #search { width: 100%; padding: 8px 12px; background-color: #121318; border: 1px solid #2a2c3a; border-radius: 6px; color: white; margin-bottom: 10px; }
        
        .level-list { list-style: none; overflow-y: auto; flex-grow: 1; }
        .level-item { padding: 10px; border-radius: 6px; margin-bottom: 5px; cursor: pointer; background-color: #21232e; display: flex; gap: 10px; }
        .level-item.active { background-color: #ff6b00; color: white; }
        .rank { font-weight: bold; }

        .main-wrapper { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-header { background-color: #1a1b23; border-bottom: 1px solid #2a2c3a; padding: 10px 20px; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
        .account-btn { display: flex; align-items: center; gap: 10px; background-color: #21232e; border: 1px solid #2a2c3a; padding: 6px 12px; border-radius: 20px; cursor: pointer; color: #fff; font-weight: bold; font-size: 14px; transition: background-color 0.2s; }
        .account-btn:hover { background-color: #2a2c3a; }
        .avatar-img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background-color: #2a2c3a; }

        .content { flex-grow: 1; padding: 20px; overflow-y: auto; }
        .level-title-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; max-width: 650px; }
        .level-title { font-size: 28px; }
        .description { color: #aaa; margin-bottom: 15px; font-size: 14px; }
        .video-container { position: relative; width: 100%; max-width: 650px; aspect-ratio: 16 / 9; margin-bottom: 15px; border-radius: 8px; overflow: hidden; background: #000; }
        .video-container iframe { width: 100%; height: 100%; border: none; }

        .info-card { background-color: #1a1b23; padding: 15px; border-radius: 8px; max-width: 650px; border: 1px solid #2a2c3a; }
        .info-row { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2c3a; padding-bottom: 6px; font-size: 14px; }
        .info-label { color: #888; font-weight: bold; }
        .info-value { color: #fff; display: flex; align-items: center; gap: 8px; }
        .difficulty-icon { height: 24px; width: auto; }
        .highlight-name { color: #ff6b00; font-weight: bold; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background-color: #1a1b23; border: 1px solid #2a2c3a; border-radius: 8px; padding: 25px; width: 90%; max-width: 450px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 20px; margin-bottom: 15px; color: #fff; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background-color: #121318; border: 1px solid #2a2c3a; border-radius: 6px; color: #fff; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-size: 13px; color: #aaa; }

        .btn-primary { width: 100%; padding: 10px; background-color: #ff6b00; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-secondary { width: 100%; padding: 8px; background-color: transparent; border: 1px solid #2a2c3a; border-radius: 6px; color: #888; cursor: pointer; }
        .btn-edit { background-color: #ff6b00; border: none; color: white; font-weight: bold; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .error-message { color: #ff4d4d; font-size: 12px; margin-bottom: 10px; display: none; }

        .profile-avatar-large { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 0 auto 15px auto; display: block; border: 2px solid #ff6b00; background-color: #2a2c3a; }
        .submission-card { background-color: #121318; border: 1px solid #2a2c3a; border-radius: 6px; padding: 12px; margin-bottom: 12px; font-size: 13px; }
        .submission-card h4 { color: #ff6b00; margin-bottom: 6px; }
        .admin-manage-box { background-color: #121318; border: 1px solid #2a2c3a; border-radius: 6px; padding: 15px; margin-top: 20px; max-width: 650px; }
    </style>
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="logo" onclick="switchTab('classic')">
                <span class="logo-highlight">German</span> Demonlist
            </div>
            <div class="tabs">
                <button class="tab active" id="tab-classic" onclick="switchTab('classic')">CLASSIC</button>
                <button class="tab" id="tab-players" onclick="switchTab('players')">PLAYERS</button>
            </div>
            <input type="text" id="search" placeholder="Search..." onkeyup="filterLevels()">
            <button class="btn-primary" style="margin-bottom: 10px;" onclick="openSubmitModal()">+ Submit Level</button>
            <ul id="level-list" class="level-list"></ul>
        </aside>

        <div class="main-wrapper">
            <header class="top-header">
                <button id="admin-pending-btn" class="account-btn" style="display: none; border-color: #ff6b00;" onclick="openAdminModal()">
                    Admin Pending (<span id="pending-count">0</span>)
                </button>
                <button class="account-btn" onclick="handleAccountClick()">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23888888'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>" id="header-avatar" class="avatar-img" alt="Avatar">
                    <span id="header-username">Log In / Register</span>
                </button>
            </header>

            <main class="content">
                <div id="level-details"></div>
            </main>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <h2 class="modal-title" id="auth-title">Log In</h2>
            <div class="error-message" id="auth-error"></div>
            <form id="auth-form" onsubmit="handleAuthSubmit(event)">
                <div class="form-group" id="username-group" style="display: none;">
                    <label for="auth-username">Ingame Username</label>
                    <input type="text" id="auth-username" placeholder="e.g. qChrc">
                </div>
                <div class="form-group">
                    <label for="auth-email">Email</label>
                    <input type="email" id="auth-email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="auth-password">Password</label>
                    <input type="password" id="auth-password" required placeholder="••••••••">
                </div>
                <div class="checkbox-group" id="remember-group">
                    <input type="checkbox" id="auth-remember" checked>
                    <label for="auth-remember">Angemeldet bleiben</label>
                </div>
                <button type="submit" class="btn-primary" id="auth-submit-btn">Log In</button>
                <button type="button" class="btn-secondary" onclick="toggleAuthMode()" id="auth-toggle-btn">Need an account? Register</button>
                <button type="button" class="btn-secondary" onclick="closeAuthModal()" style="margin-top: 5px;">Cancel</button>
            </form>
        </div>
    </div>

    <div class="modal" id="submit-modal">
        <div class="modal-content">
            <h2 class="modal-title">Submit Level / Record</h2>
            <div class="error-message" id="submit-error"></div>
            <form id="submit-form" onsubmit="handleFormSubmission(event)">
                <div class="form-group">
                    <label for="sub-player">Ingame Username</label>
                    <input type="text" id="sub-player" required placeholder="e.g. qChrc">
                </div>
                <div class="form-group">
                    <label for="sub-name">Level Name</label>
                    <input type="text" id="sub-name" required placeholder="e.g. Bloodbath">
                </div>
                <div class="form-group">
                    <label for="sub-difficulty">Difficulty</label>
                    <select id="sub-difficulty">
                        <option value="Easy Demon">Easy Demon</option>
                        <option value="Medium Demon">Medium Demon</option>
                        <option value="Hard Demon">Hard Demon</option>
                        <option value="Insane Demon">Insane Demon</option>
                        <option value="Extreme Demon">Extreme Demon</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="sub-publisher">Publisher</label>
                    <input type="text" id="sub-publisher" required placeholder="e.g. Riot">
                </div>
                <div class="form-group">
                    <label for="sub-creator">Creator</label>
                    <input type="text" id="sub-creator" required placeholder="e.g. Riot & More">
                </div>
                <div class="form-group">
                    <label for="sub-youtube">YouTube Video ID</label>
                    <input type="text" id="sub-youtube" required placeholder="JCAOQQu4Iy0">
                </div>
                <div class="form-group">
                    <label for="sub-description">Description / Notes</label>
                    <input type="text" id="sub-description" placeholder="Optional info">
                </div>
                <button type="submit" class="btn-primary">Submit</button>
                <button type="button" class="btn-secondary" onclick="closeSubmitModal()">Cancel</button>
            </form>
        </div>
    </div>

    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <h2 class="modal-title">Edit Level</h2>
            <form id="edit-form" onsubmit="handleLevelEditSubmit(event)">
                <input type="hidden" id="edit-index">
                <div class="form-group">
                    <label for="edit-rank">Platzierung (Rang)</label>
                    <input type="number" id="edit-rank" min="1" required>
                </div>
                <div class="form-group">
                    <label for="edit-name">Level Name</label>
                    <input type="text" id="edit-name" required>
                </div>
                <div class="form-group">
                    <label for="edit-difficulty">Difficulty</label>
                    <select id="edit-difficulty">
                        <option value="Easy Demon">Easy Demon</option>
                        <option value="Medium Demon">Medium Demon</option>
                        <option value="Hard Demon">Hard Demon</option>
                        <option value="Insane Demon">Insane Demon</option>
                        <option value="Extreme Demon">Extreme Demon</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-publisher">Publisher</label>
                    <input type="text" id="edit-publisher" required>
                </div>
                <div class="form-group">
                    <label for="edit-creator">Creator</label>
                    <input type="text" id="edit-creator" required>
                </div>
                <div class="form-group">
                    <label for="edit-verifier">Verifier</label>
                    <input type="text" id="edit-verifier" required>
                </div>
                <div class="form-group">
                    <label for="edit-orig-verifier">Original Verifier</label>
                    <input type="text" id="edit-orig-verifier" required>
                </div>
                <div class="form-group">
                    <label for="edit-victors">Other Victors (mit Komma trennen)</label>
                    <input type="text" id="edit-victors" placeholder="z.B. Player1, Player2">
                </div>
                <div class="form-group">
                    <label for="edit-youtube">YouTube Video ID</label>
                    <input type="text" id="edit-youtube" required>
                </div>
                <div class="form-group">
                    <label for="edit-description">Description</label>
                    <input type="text" id="edit-description">
                </div>

                <button type="submit" class="btn-primary">Save Changes</button>
                <button type="button" class="btn-secondary" onclick="closeEditModal()">Cancel</button>
            </form>
        </div>
    </div>

    <div class="modal" id="edit-player-modal">
        <div class="modal-content">
            <h2 class="modal-title">Edit Player</h2>
            <form id="edit-player-form" onsubmit="handlePlayerEditSubmit(event)">
                <input type="hidden" id="edit-player-index">
                <div class="form-group">
                    <label for="edit-player-name">Player Name</label>
                    <input type="text" id="edit-player-name" required>
                </div>
                <div class="form-group">
                    <label for="edit-player-points">Points</label>
                    <input type="number" step="0.1" id="edit-player-points" required>
                </div>
                <div class="form-group">
                    <label for="edit-player-hardest">Current Hardest</label>
                    <input type="text" id="edit-player-hardest" required>
                </div>
                <div class="form-group">
                    <label for="edit-player-extremes">Beaten Extremes (mit Komma trennen)</label>
                    <input type="text" id="edit-player-extremes" placeholder="z.B. Cataclysm, ACU">
                </div>

                <button type="submit" class="btn-primary">Save Player Changes</button>
                <button type="button" class="btn-secondary" onclick="closeEditPlayerModal()">Cancel</button>
            </form>
        </div>
    </div>

    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <h2 class="modal-title">Pending Submissions</h2>
            <div id="admin-submissions-list">
                <p style="color: #888;">No pending submissions.</p>
            </div>
            <button type="button" class="btn-secondary" onclick="closeAdminModal()" style="margin-top: 15px;">Close</button>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc,
            updateDoc,
            collection,
            addDoc,
            getDocs,
            deleteDoc,
            query,
            where,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBaHc7pgi4RaKSYrL3X_BotZ8VB15XBKIY",
            authDomain: "german-demonlist.firebaseapp.com",
            projectId: "german-demonlist",
            storageBucket: "german-demonlist.firebasestorage.app",
            messagingSenderId: "502395064717",
            appId: "1:502395064717:web:4c5919fed8ec30p48c5pc4",
            measurementId: "G-78M8FVNYQX"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23888888'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>";

        let currentUserData = null;
        let isRegisterMode = false;
        let pendingSubmissions = [];

        let demons = [];
        let players = [];
        let selectedIndex = 0;

        const OWNER_NAME = "qchrc"; 

        // Initialdaten für den einmaligen automatischen Upload
        const initialDemonsData = [
            { rank: 1, name: "Acheron", difficulty: "Extreme Demon", difficultyIcon: "extreme.jpg", publisher: "ryu", creator: "ryu & more", myVerifier: "qChrc", originalVerifier: "Zoink", victors: [], youtubeId: "L8S3pG1k3YI", description: "Top 1 Demon in Germany", tier: 10 },
            { rank: 2, name: "Slaughterhouse", difficulty: "Extreme Demon", difficultyIcon: "extreme.jpg", publisher: "IcEDCave", creator: "IcEDCave & more", myVerifier: "qChrc", originalVerifier: "Doggie", victors: ["Player1"], youtubeId: "7L8I0aB5I4c", description: "Insane wave control", tier: 9 }
        ];

        const initialPlayersData = [
            { placement: 1, name: "qChrc", points: 35.0, currentHardest: "Acheron", beatenExtremes: ["Acheron", "Slaughterhouse"] },
            { placement: 2, name: "Player1", points: 15.0, currentHardest: "Slaughterhouse", beatenExtremes: ["Slaughterhouse"] }
        ];

        const baseValues = {
            "Easy Demon": 1,
            "Medium Demon": 2,
            "Hard Demon": 3,
            "Insane Demon": 5,
            "Extreme Demon": 10
        };

        const tierMultipliers = {
            1: 1.0, 2: 1.2, 3: 1.4, 4: 1.6, 5: 1.8,
            6: 2.0, 7: 2.3, 8: 2.6, 9: 3.0, 10: 3.5
        };

        function getTierByRank(difficulty, rank) {
            if (difficulty === "Easy Demon") return 1;
            if (difficulty === "Medium Demon") return 2;
            if (difficulty === "Hard Demon") return 4;
            if (difficulty === "Insane Demon") return 6;

            if (rank <= 3) return 10;
            if (rank <= 7) return 9;
            if (rank <= 12) return 8;
            if (rank <= 20) return 7;
            if (rank <= 30) return 6;
            return 5;
        }

        function calculatePoints(difficulty, tier) {
            const base = baseValues[difficulty] || 1;
            const mult = tierMultipliers[tier] || 1.0;
            return Math.round((base * mult) * 10) / 10;
        }

        function isUserAdmin() {
            if (!currentUserData) return false;
            const name = (currentUserData.username || "").toLowerCase();
            const role = (currentUserData.role || "").toLowerCase();
            return name === OWNER_NAME || role === "admin" || role === "owner";
        }

        function isUserOwner() {
            if (!currentUserData) return false;
            const name = (currentUserData.username || "").toLowerCase();
            const role = (currentUserData.role || "").toLowerCase();
            return name === OWNER_NAME || role === "owner";
        }

        // --- FIRESTORE ECHTZEIT-LISTEN (Persistent Database) ---
        function syncDataFromFirebase() {
            onSnapshot(doc(db, "listdata", "demons"), (docSnap) => {
                if (docSnap.exists() && docSnap.data().items && docSnap.data().items.length > 0) {
                    demons = docSnap.data().items;
                } else {
                    // Falls die Datenbank noch leer ist, spiele automatisch die Initialdaten ein
                    saveDemonsToFirebase(initialDemonsData);
                    demons = initialDemonsData;
                }
                loadLevelList();
            });

            onSnapshot(doc(db, "listdata", "players"), (docSnap) => {
                if (docSnap.exists() && docSnap.data().items && docSnap.data().items.length > 0) {
                    players = docSnap.data().items;
                } else {
                    // Falls die Datenbank noch leer ist, spiele automatisch die Initialdaten ein
                    savePlayersToFirebase(initialPlayersData);
                    players = initialPlayersData;
                }
                loadLevelList();
            });
        }

        async function saveDemonsToFirebase(data) {
            try {
                await setDoc(doc(db, "listdata", "demons"), { items: data });
            } catch (e) {
                console.error("Error saving demons: ", e);
            }
        }

        async function savePlayersToFirebase(data) {
            try {
                await setDoc(doc(db, "listdata", "players"), { items: data });
            } catch (e) {
                console.error("Error saving players: ", e);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    currentUserData = userDoc.data();
                } else {
                    currentUserData = {
                        username: user.email.split("@")[0],
                        avatarUrl: DEFAULT_AVATAR,
                        role: "user"
                    };
                }
                updateHeaderUI(true);
                checkAdminStatus();
            } else {
                currentUserData = null;
                updateHeaderUI(false);
                document.getElementById("admin-pending-btn").style.display = "none";
            }
        });

        function updateHeaderUI(isLoggedIn) {
            const avatar = document.getElementById("header-avatar");
            const name = document.getElementById("header-username");

            if (isLoggedIn && currentUserData) {
                avatar.src = currentUserData.avatarUrl || DEFAULT_AVATAR;
                name.textContent = currentUserData.username || "Profile";
            } else {
                avatar.src = DEFAULT_AVATAR;
                name.textContent = "Log In / Register";
            }
        }

        async function checkAdminStatus() {
            if (isUserAdmin()) {
                document.getElementById("admin-pending-btn").style.display = "flex";
                loadPendingSubmissions();
            } else {
                document.getElementById("admin-pending-btn").style.display = "none";
            }
        }

        async function loadPendingSubmissions() {
            try {
                const querySnapshot = await getDocs(collection(db, "submissions"));
                pendingSubmissions = [];
                querySnapshot.forEach((docSnap) => {
                    pendingSubmissions.push({ id: docSnap.id, ...docSnap.data() });
                });
                document.getElementById("pending-count").textContent = pendingSubmissions.length;
            } catch (e) {
                console.error("Error loading submissions: ", e);
            }
        }

        window.promoteToAdmin = async function() {
            if (!isUserOwner()) return;
            const targetUsername = document.getElementById("admin-promote-input").value.trim();
            if (!targetUsername) return;

            try {
                const q = query(collection(db, "users"), where("username", "==", targetUsername));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    alert("Benutzer nicht gefunden!");
                    return;
                }

                querySnapshot.forEach(async (userDoc) => {
                    await updateDoc(doc(db, "users", userDoc.id), { role: "admin" });
                    alert(`${targetUsername} wurde erfolgreich zum Admin befördert!`);
                    document.getElementById("admin-promote-input").value = "";
                });
            } catch (e) {
                alert("Fehler bei Beförderung: " + e.message);
            }
        };

        window.demoteAdmin = async function() {
            if (!isUserOwner()) return;
            const targetUsername = document.getElementById("admin-promote-input").value.trim();
            if (!targetUsername) return;

            if (targetUsername.toLowerCase() === OWNER_NAME) {
                alert("Der Owner kann nicht degradiert werden!");
                return;
            }

            try {
                const q = query(collection(db, "users"), where("username", "==", targetUsername));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    alert("Benutzer nicht gefunden!");
                    return;
                }

                querySnapshot.forEach(async (userDoc) => {
                    await updateDoc(doc(db, "users", userDoc.id), { role: "user" });
                    alert(`${targetUsername} wurde wieder zum normalen User degradiert.`);
                    document.getElementById("admin-promote-input").value = "";
                });
            } catch (e) {
                alert("Fehler bei Degradierung: " + e.message);
            }
        };

        window.openEditModal = function(index) {
            if (!isUserAdmin()) return;
            const demon = demons[index];
            document.getElementById("edit-index").value = index;
            document.getElementById("edit-rank").value = demon.rank;
            document.getElementById("edit-name").value = demon.name;
            document.getElementById("edit-difficulty").value = demon.difficulty;
            document.getElementById("edit-publisher").value = demon.publisher;
            document.getElementById("edit-creator").value = demon.creator;
            document.getElementById("edit-verifier").value = demon.myVerifier;
            document.getElementById("edit-orig-verifier").value = demon.originalVerifier || "";
            document.getElementById("edit-victors").value = demon.victors ? demon.victors.join(", ") : "";
            document.getElementById("edit-youtube").value = demon.youtubeId;
            document.getElementById("edit-description").value = demon.description || "";

            document.getElementById("edit-modal").classList.add("active");
        };

        window.closeEditModal = function() {
            document.getElementById("edit-modal").classList.remove("active");
        };

        window.handleLevelEditSubmit = async function(e) {
            e.preventDefault();
            if (!isUserAdmin()) return;

            const index = parseInt(document.getElementById("edit-index").value);
            const newRank = parseInt(document.getElementById("edit-rank").value);

            let diffIcon = "easy.webp";
            const diff = document.getElementById("edit-difficulty").value;
            if (diff === "Medium Demon") diffIcon = "medium.webp";
            if (diff === "Insane Demon") diffIcon = "insane.png";
            if (diff === "Extreme Demon") diffIcon = "extreme.jpg";

            const autoTier = getTierByRank(diff, newRank);

            const rawVictors = document.getElementById("edit-victors").value;
            const victorsArray = rawVictors.split(",").map(v => v.trim()).filter(v => v.length > 0);

            const updatedDemon = {
                ...demons[index],
                rank: newRank,
                name: document.getElementById("edit-name").value.trim(),
                difficulty: diff,
                difficultyIcon: diffIcon,
                publisher: document.getElementById("edit-publisher").value.trim(),
                creator: document.getElementById("edit-creator").value.trim(),
                myVerifier: document.getElementById("edit-verifier").value.trim(),
                originalVerifier: document.getElementById("edit-orig-verifier").value.trim(),
                victors: victorsArray,
                youtubeId: document.getElementById("edit-youtube").value.trim(),
                description: document.getElementById("edit-description").value.trim(),
                tier: autoTier
            };

            demons.splice(index, 1);
            demons.splice(newRank - 1, 0, updatedDemon);
            demons.forEach((d, i) => d.rank = i + 1);

            await saveDemonsToFirebase(demons);
            closeEditModal();
        };

        window.openEditPlayerModal = function(index) {
            if (!isUserAdmin()) return;
            const player = players[index];
            document.getElementById("edit-player-index").value = index;
            document.getElementById("edit-player-name").value = player.name;
            document.getElementById("edit-player-points").value = player.points;
            document.getElementById("edit-player-hardest").value = player.currentHardest;
            document.getElementById("edit-player-extremes").value = player.beatenExtremes ? player.beatenExtremes.join(", ") : "";

            document.getElementById("edit-player-modal").classList.add("active");
        };

        window.closeEditPlayerModal = function() {
            document.getElementById("edit-player-modal").classList.remove("active");
        };

        window.handlePlayerEditSubmit = async function(e) {
            e.preventDefault();
            if (!isUserAdmin()) return;

            const index = parseInt(document.getElementById("edit-player-index").value);
            const rawExtremes = document.getElementById("edit-player-extremes").value;
            const extremesArray = rawExtremes.split(",").map(ex => ex.trim()).filter(ex => ex.length > 0);

            players[index] = {
                ...players[index],
                name: document.getElementById("edit-player-name").value.trim(),
                points: parseFloat(document.getElementById("edit-player-points").value) || 0,
                currentHardest: document.getElementById("edit-player-hardest").value.trim(),
                beatenExtremes: extremesArray
            };

            players.sort((a, b) => b.points - a.points);
            players.forEach((p, i) => p.placement = i + 1);

            await savePlayersToFirebase(players);
            closeEditPlayerModal();
        };

        window.openSubmitModal = function() {
            if (!auth.currentUser) {
                openAuthModal();
                return;
            }
            if (currentUserData && currentUserData.username) {
                document.getElementById("sub-player").value = currentUserData.username;
            }
            document.getElementById("submit-modal").classList.add("active");
            document.getElementById("submit-error").style.display = "none";
        };

        window.closeSubmitModal = function() {
            document.getElementById("submit-modal").classList.remove("active");
        };

        window.handleFormSubmission = async function(e) {
            e.preventDefault();
            try {
                await addDoc(collection(db, "submissions"), {
                    player: document.getElementById("sub-player").value.trim(),
                    name: document.getElementById("sub-name").value.trim(),
                    difficulty: document.getElementById("sub-difficulty").value,
                    publisher: document.getElementById("sub-publisher").value.trim(),
                    creator: document.getElementById("sub-creator").value.trim(),
                    youtubeId: document.getElementById("sub-youtube").value.trim(),
                    description: document.getElementById("sub-description").value.trim(),
                    submittedAt: new Date().toISOString()
                });
                alert("Submission successful! Waiting for approval.");
                closeSubmitModal();
                if (isUserAdmin()) loadPendingSubmissions();
            } catch (err) {
                const errEl = document.getElementById("submit-error");
                errEl.textContent = err.message;
                errEl.style.display = "block";
            }
        };

        window.openAdminModal = async function() {
            await loadPendingSubmissions();
            const container = document.getElementById("admin-submissions-list");
            container.innerHTML = "";

            if (pendingSubmissions.length === 0) {
                container.innerHTML = `<p style="color: #888;">No pending submissions.</p>`;
            } else {
                pendingSubmissions.forEach((sub, idx) => {
                    const card = document.createElement("div");
                    card.className = "submission-card";
                    card.innerHTML = `
                        <h4>${sub.name} (${sub.difficulty})</h4>
                        <p><strong>Player:</strong> ${sub.player}</p>
                        <p><strong>Publisher/Creator:</strong> ${sub.publisher} / ${sub.creator}</p>
                        <p><strong>YouTube ID:</strong> ${sub.youtubeId}</p>
                        <div style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
                            <label style="font-size: 11px;">Platzierung (Rang):</label>
                            <input type="number" id="rank-input-${idx}" min="1" max="${demons.length + 1}" value="1" style="width: 60px; padding: 4px; background: #1a1b23; border: 1px solid #2a2c3a; color: white; border-radius: 4px;">
                            <button class="btn-primary" style="width: auto; padding: 4px 10px; margin:0;" onclick="approveSubmission('${sub.id}', ${idx})">Approve</button>
                            <button class="btn-secondary" style="width: auto; padding: 4px 10px; margin:0; color: #ff4d4d; border-color: #ff4d4d;" onclick="rejectSubmission('${sub.id}')">Reject</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            document.getElementById("admin-modal").classList.add("active");
        };

        window.closeAdminModal = function() {
            document.getElementById("admin-modal").classList.remove("active");
        };

        window.rejectSubmission = async function(docId) {
            try {
                await deleteDoc(doc(db, "submissions", docId));
                openAdminModal();
            } catch (e) {
                alert("Error deleting submission: " + e.message);
            }
        };

        window.approveSubmission = async function(docId, idx) {
            const sub = pendingSubmissions.find(s => s.id === docId);
            if (!sub) return;

            const existingDemonIndex = demons.findIndex(d => d.name.toLowerCase() === sub.name.toLowerCase());
            let autoTier, calculatedPoints, targetRank;

            if (existingDemonIndex !== -1) {
                const existingDemon = demons[existingDemonIndex];
                targetRank = existingDemon.rank;
                autoTier = getTierByRank(existingDemon.difficulty, existingDemon.rank);
                calculatedPoints = calculatePoints(existingDemon.difficulty, autoTier);

                if (!existingDemon.victors) existingDemon.victors = [];

                const alreadyVictor = existingDemon.victors.some(v => v.toLowerCase() === sub.player.toLowerCase());
                const isVerifier = existingDemon.myVerifier.toLowerCase() === sub.player.toLowerCase();

                if (!alreadyVictor && !isVerifier) existingDemon.victors.push(sub.player);
            } else {
                const rankInput = document.getElementById(`rank-input-${idx}`).value;
                targetRank = parseInt(rankInput) || 1;
                autoTier = getTierByRank(sub.difficulty, targetRank);
                calculatedPoints = calculatePoints(sub.difficulty, autoTier);

                let diffIcon = "easy.webp";
                if (sub.difficulty === "Medium Demon") diffIcon = "medium.webp";
                if (sub.difficulty === "Insane Demon") diffIcon = "insane.png";
                if (sub.difficulty === "Extreme Demon") diffIcon = "extreme.jpg";

                const newDemon = {
                    rank: targetRank,
                    name: sub.name,
                    difficulty: sub.difficulty,
                    difficultyIcon: diffIcon,
                    publisher: sub.publisher,
                    creator: sub.creator,
                    myVerifier: sub.player,
                    originalVerifier: sub.publisher,
                    victors: [],
                    youtubeId: sub.youtubeId,
                    description: sub.description || "Community Submission",
                    tier: autoTier
                };

                demons.splice(targetRank - 1, 0, newDemon);
                demons.forEach((d, i) => d.rank = i + 1);
            }

            const levelDifficulty = existingDemonIndex !== -1 ? demons[existingDemonIndex].difficulty : sub.difficulty;
            const levelName = existingDemonIndex !== -1 ? demons[existingDemonIndex].name : sub.name;

            let playerObj = players.find(p => p.name.toLowerCase() === sub.player.toLowerCase());
            if (!playerObj) {
                playerObj = {
                    placement: players.length + 1,
                    name: sub.player,
                    currentHardest: levelName,
                    points: calculatedPoints,
                    beatenExtremes: levelDifficulty === "Extreme Demon" ? [levelName] : []
                };
                players.push(playerObj);
            } else {
                playerObj.points += calculatedPoints;
                if (levelDifficulty === "Extreme Demon" && !playerObj.beatenExtremes.includes(levelName)) {
                    playerObj.beatenExtremes.push(levelName);
                }
                playerObj.currentHardest = levelName;
            }

            players.sort((a, b) => b.points - a.points);
            players.forEach((p, i) => p.placement = i + 1);

            await saveDemonsToFirebase(demons);
            await savePlayersToFirebase(players);
            await deleteDoc(doc(db, "submissions", docId));

            openAdminModal();
        };

        window.handleAccountClick = function() {
            if (auth.currentUser) {
                switchTab('profile');
            } else {
                openAuthModal();
            }
        };

        function openAuthModal() {
            document.getElementById("auth-modal").classList.add("active");
            document.getElementById("auth-error").style.display = "none";
        }

        window.closeAuthModal = function() {
            document.getElementById("auth-modal").classList.remove("active");
        };

        window.toggleAuthMode = function() {
            isRegisterMode = !isRegisterMode;
            document.getElementById("auth-title").textContent = isRegisterMode ? "Register" : "Log In";
            document.getElementById("username-group").style.display = isRegisterMode ? "block" : "none";
            document.getElementById("auth-submit-btn").textContent = isRegisterMode ? "Register" : "Log In";
            document.getElementById("auth-toggle-btn").textContent = isRegisterMode ? "Already have an account? Log In" : "Need an account? Register";
            document.getElementById("auth-error").style.display = "none";
        };

        window.handleAuthSubmit = async function(e) {
            e.preventDefault();
            const email = document.getElementById("auth-email").value;
            const password = document.getElementById("auth-password").value;
            const remember = document.getElementById("auth-remember").checked;
            const errorElement = document.getElementById("auth-error");

            errorElement.style.display = "none";

            try {
                const persistence = remember ? browserLocalPersistence : browserSessionPersistence;
                await setPersistence(auth, persistence);

                if (isRegisterMode) {
                    const username = document.getElementById("auth-username").value.trim() || email.split("@")[0];
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    const isOwner = username.toLowerCase() === OWNER_NAME;

                    await setDoc(doc(db, "users", user.uid), {
                        username: username,
                        avatarUrl: DEFAULT_AVATAR,
                        role: isOwner ? "owner" : "user",
                        createdAt: new Date().toISOString()
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }

                closeAuthModal();
            } catch (error) {
                errorElement.textContent = error.message;
                errorElement.style.display = "block";
            }
        };

        window.handleLogout = async function() {
            await signOut(auth);
            switchTab('classic');
        };

        window.updateAvatarUrl = async function() {
            const newUrl = prompt("Gib den Bild-Link (URL) für dein neues Profilbild ein:", currentUserData?.avatarUrl || "");
            if (newUrl && auth.currentUser) {
                try {
                    await updateDoc(doc(db, "users", auth.currentUser.uid), { avatarUrl: newUrl });
                    currentUserData.avatarUrl = newUrl;
                    updateHeaderUI(true);
                    selectLevel(selectedIndex);
                } catch (e) {
                    alert("Fehler beim Speichern des Profilbilds: " + e.message);
                }
            }
        };

        window.currentTab = "classic";

        window.switchTab = function(tab) {
            window.currentTab = tab;
            document.getElementById("tab-classic").classList.toggle("active", tab === "classic");
            document.getElementById("tab-players").classList.toggle("active", tab === "players");
            document.getElementById("search").value = "";
            loadLevelList();
        };

        function loadLevelList() {
            const listElement = document.getElementById("level-list");
            listElement.innerHTML = "";

            if (window.currentTab === "profile") {
                selectLevel(0);
                return;
            }

            const data = window.currentTab === "classic" ? demons : players;

            data.forEach((item, index) => {
                const li = document.createElement("li");
                li.className = `level-item ${index === selectedIndex ? 'active' : ''}`;
                li.onclick = () => selectLevel(index);

                const num = window.currentTab === "classic" ? item.rank : item.placement;
                li.innerHTML = `<span class="rank">#${num}</span> <span class="name">${item.name}</span>`;
                listElement.appendChild(li);
            });

            if (data.length > 0) {
                selectLevel(selectedIndex < data.length ? selectedIndex : 0);
            } else {
                document.getElementById("level-details").innerHTML = "<p style='color:#888;'>Keine Daten in der Datenbank gefunden.</p>";
            }
        }

        function selectLevel(index) {
            selectedIndex = index;
            const items = document.querySelectorAll(".level-item");
            items.forEach((item, i) => {
                item.classList.toggle("active", i === index);
            });

            const detailsContainer = document.getElementById("level-details");

            if (window.currentTab === "profile") {
                const username = currentUserData?.username || "Player";
                const matchingPlayer = players.find(p => p.name.toLowerCase() === username.toLowerCase()) || {
                    placement: "-", points: 0, currentHardest: "-", beatenExtremes: []
                };

                const ownerPanelHTML = isUserOwner() ? `
                    <div class="admin-manage-box">
                        <h3 style="color: #ff6b00; margin-bottom: 10px;">Owner Panel: Admin Management</h3>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <input type="text" id="admin-promote-input" placeholder="Ingame Username" style="padding: 8px; background: #121318; border: 1px solid #2a2c3a; color: white; border-radius: 6px; flex-grow: 1;">
                            <button class="btn-primary" style="width: auto; margin: 0;" onclick="promoteToAdmin()">Make Admin</button>
                            <button class="btn-secondary" style="width: auto; margin: 0; color: #ff4d4d; border-color: #ff4d4d;" onclick="demoteAdmin()">Remove Admin</button>
                        </div>
                    </div>
                ` : '';

                detailsContainer.innerHTML = `
                    <div style="margin-bottom: 15px;">
                        <button class="btn-secondary" style="width: auto; padding: 6px 12px; font-size: 13px;" onclick="switchTab('classic')">← Back to List</button>
                    </div>

                    <img src="${currentUserData?.avatarUrl || DEFAULT_AVATAR}" class="profile-avatar-large" alt="Avatar">
                    <h1 class="level-title" style="text-align: center;">${username}</h1>
                    <p class="description" style="text-align: center;">My Profile ${isUserAdmin() ? '(Admin/Owner)' : ''}</p>

                    <div style="text-align: center; margin-bottom: 20px;">
                        <button class="btn-primary" style="width: auto; padding: 6px 15px; font-size: 13px;" onclick="updateAvatarUrl()">Change Profile Picture</button>
                    </div>

                    <div class="info-card" style="margin: 0 auto;">
                        <div class="info-row">
                            <span class="info-label">Placement:</span>
                            <span class="info-value">#${matchingPlayer.placement}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Points:</span>
                            <span class="info-value">${matchingPlayer.points}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Current Hardest:</span>
                            <span class="info-value highlight-name">${matchingPlayer.currentHardest}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Beaten Extremes:</span>
                            <span class="info-value">${matchingPlayer.beatenExtremes.length > 0 ? matchingPlayer.beatenExtremes.join(", ") : "None"}</span>
                        </div>
                    </div>

                    ${ownerPanelHTML}

                    <div style="text-align: center; margin-top: 25px;">
                        <button class="btn-secondary" style="width: auto; padding: 8px 20px; color: #ff4d4d; border-color: #ff4d4d;" onclick="handleLogout()">Log Out</button>
                    </div>
                `;
            } else if (window.currentTab === "classic") {
                const demon = demons[index];
                if (!demon) return;
                const editButtonHTML = isUserAdmin() ? `<button class="btn-edit" onclick="openEditModal(${index})">✏️ Edit Level</button>` : '';

                detailsContainer.innerHTML = `
                    <div class="level-title-container">
                        <h1 class="level-title">#${demon.rank} - ${demon.name}</h1>
                        ${editButtonHTML}
                    </div>
                    <p class="description">${demon.description || ""}</p>
                    
                    <div class="video-container">
                        <iframe src="https://www.youtube-nocookie.com/embed/${demon.youtubeId}" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    </div>

                    <div class="info-card">
                        <div class="info-row">
                            <span class="info-label">Difficulty:</span>
                            <span class="info-value">
                                <img src="${demon.difficultyIcon}" alt="${demon.difficulty}" class="difficulty-icon">
                                ${demon.difficulty}
                            </span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Publisher:</span>
                            <span class="info-value">${demon.publisher}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Creator:</span>
                            <span class="info-value">${demon.creator}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Verifier:</span>
                            <span class="info-value ${demon.myVerifier?.toLowerCase() === 'qchrc' ? 'highlight-name' : ''}">${demon.myVerifier}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Original Verifier:</span>
                            <span class="info-value">${demon.originalVerifier}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Other Victors:</span>
                            <span class="info-value">${demon.victors && demon.victors.length > 0 ? demon.victors.join(", ") : "Keine"}</span>
                        </div>
                    </div>
                `;
            } else {
                const player = players[index];
                if (!player) return;
                const editPlayerButtonHTML = isUserAdmin() ? `<button class="btn-edit" onclick="openEditPlayerModal(${index})">✏️ Edit Player</button>` : '';

                detailsContainer.innerHTML = `
                    <div class="level-title-container">
                        <h1 class="level-title">#${player.placement} - ${player.name}</h1>
                        ${editPlayerButtonHTML}
                    </div>
                    <p class="description">Player Profile</p>

                    <div class="info-card">
                        <div class="info-row">
                            <span class="info-label">Placement:</span>
                            <span class="info-value">#${player.placement}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Points:</span>
                            <span class="info-value">${player.points}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Current Hardest:</span>
                            <span class="info-value highlight-name">${player.currentHardest}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Beaten Extremes:</span>
                            <span class="info-value">${player.beatenExtremes && player.beatenExtremes.length > 0 ? player.beatenExtremes.join(", ") : "None"}</span>
                        </div>
                    </div>
                `;
            }
        }

        window.filterLevels = function() {
            const query = document.getElementById("search").value.toLowerCase();
            const items = document.querySelectorAll(".level-item");
            const data = window.currentTab === "classic" ? demons : players;

            items.forEach((item, index) => {
                if (data[index]) {
                    const text = data[index].name.toLowerCase();
                    item.style.display = text.includes(query) ? "flex" : "none";
                }
            });
        };

        window.onload = syncDataFromFirebase;
    </script>
</body>
</html>
